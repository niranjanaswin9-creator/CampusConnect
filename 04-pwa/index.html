<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CampusConnect</title>
    <meta name="theme-color" content="#1F3864" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div id="offline-banner" class="offline-banner" hidden>
      You are offline. Showing saved information.
    </div>

    <header class="topbar">
      <h1>CampusConnect</h1>
      <button id="install-btn" class="install-btn" hidden>Install app</button>
    </header>

    <nav class="tabs">
      <button class="tab active" data-target="dashboard">Dashboard</button>
      <button class="tab" data-target="timetable">Timetable</button>
    </nav>

    <main>
      <section id="dashboard" class="panel active">
        <h2 id="greeting"></h2>
        <p id="today-date" class="muted"></p>
        <div id="cards" class="cards"></div>
      </section>

      <section id="timetable" class="panel">
        <div id="day-buttons" class="day-buttons"></div>
        <div id="class-list" class="class-list"></div>
      </section>
    </main>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
